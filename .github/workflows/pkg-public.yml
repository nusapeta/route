name: pkg-public
on:
  workflow_dispatch:
permissions:
  packages: write
jobs:
  flip:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        package: [route, route-tools]
    steps:
      - name: Make ${{ matrix.package }} public
        run: |
          code=$(curl -sS -o out.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/nusapeta/packages/container/${{ matrix.package }}" \
            -d '{"visibility":"public"}')
          cat out.json
          test "$code" = 200
