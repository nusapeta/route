name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -l ./cmd ./internal | tee /tmp/fmt && test ! -s /tmp/fmt
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o bin/ ./cmd/...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: docs links
        run: python3 scripts/check_links.py

  tools-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build tools image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.tools
          push: false
          load: true
          tags: nusapeta/route-tools:ci
      - name: Smoke tools image
        run: docker run --rm nusapeta/route-tools:ci -h
