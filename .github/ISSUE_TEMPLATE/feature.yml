name: Feature request
description: New capability or behavior change
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Read `docs/ROADMAP.md` first. Non-goals there are not implemented
        without a new reason.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is blocked, and in what situation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior, including request/response shape when relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered.
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - routing
        - data or extraction
        - HTTP API
        - operations or deploy
        - documentation
        - other
    validations:
      required: true
