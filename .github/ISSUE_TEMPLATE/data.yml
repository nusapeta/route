name: Data or route report
description: Wrong route, missing road, or incorrect access tag
title: "data: "
labels: ["data"]
body:
  - type: markdown
    attributes:
      value: |
        Most errors come from OpenStreetMap data, not from the code. The
        permanent fix usually goes into OSM, and the next monthly data release
        picks it up.
  - type: input
    id: pair
    attributes:
      label: from/to pair
      description: Coordinates `lat,lon` exactly as sent.
      placeholder: "-6.2088,106.8456 -> -6.2297,106.8166"
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options:
        - mobil (car)
        - motor (motorcycle)
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Current result
      description: Distance, duration, and geometry summary. Link the OSM object if available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Which road should be used, and why.
    validations:
      required: true
  - type: input
    id: graph
    attributes:
      label: Graph
      description: PBF hash from `/healthz` or the data release name.
      placeholder: data-2026.11
  - type: checkboxes
    id: osm
    attributes:
      label: Source data
      options:
        - label: I checked the related OSM objects and believe the data is correct.
