name: Bug report
description: Wrong behavior, a crash, or an unexpected HTTP response
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Read `SECURITY.md`.
        For a route that looks wrong but does not crash, use the
        "Data or route report" form.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual response, status code, and error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: request
    attributes:
      label: Request
      description: Full URL or curl command.
      placeholder: curl -s 'http://127.0.0.1:8080/route?from=...&to=...'
    validations:
      required: true
  - type: textarea
    id: graph
    attributes:
      label: Graph and version
      description: "`/healthz` output (format, PBF hash, extractor) or `nusa-graphinfo`."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`/version` or commit."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Related log lines, without personal data.
      render: text
