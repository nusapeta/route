name: Laporan bug
description: Perilaku yang salah, crash, atau respons HTTP tak terduga
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Jangan laporkan kerentanan di sini. Baca `SECURITY.md`.
        Untuk rute yang terasa salah tetapi tidak crash, pakai formulir
        "Laporan data atau rute".
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi
      description: Respons aktual, kode status, dan pesan error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Apa yang diharapkan
    validations:
      required: true
  - type: input
    id: request
    attributes:
      label: Request
      description: URL lengkap atau perintah curl.
      placeholder: curl -s 'http://127.0.0.1:8080/route?from=...&to=...'
    validations:
      required: true
  - type: textarea
    id: graph
    attributes:
      label: Graph dan versi
      description: Keluaran `/healthz` (format, hash PBF, extractor) atau `nusa-graphinfo`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versi
      description: `/version` atau commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: Baris log terkait, tanpa data pribadi.
      render: text
