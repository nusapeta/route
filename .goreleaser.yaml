version: 2
project_name: nusapeta-route
before:
  hooks:
    - go mod tidy
builds:
  - id: nusa-serve
    main: ./cmd/nusa-serve
    binary: nusa-serve
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.commit={{ .Commit }} -X main.buildTime={{ .Date }}
  - id: nusa-gateway
    main: ./cmd/nusa-gateway
    binary: nusa-gateway
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.commit={{ .Commit }}
  - id: nusa-extract
    main: ./cmd/nusa-extract
    binary: nusa-extract
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/nusapeta/route/internal/extract.Version={{ .Version }}
  - id: nusa-route
    main: ./cmd/nusa-route
    binary: nusa-route
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: nusa-graphinfo
    main: ./cmd/nusa-graphinfo
    binary: nusa-graphinfo
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: SHA256SUMS
changelog:
  # The repository history is not a changelog: the first tag would list every
  # commit ever made, including merge commits that name internal branches.
  # CHANGELOG.md is written for readers and is the release body.
  disable: true
release:
  draft: false
  prerelease: auto
  header: |
    First public release of Nusapeta Route 0.1.0.

    Release notes: [`CHANGELOG.md`](https://github.com/nusapeta/route/blob/v0.1.0/CHANGELOG.md).
    Data artifacts are published separately under the `data-2026.11` tag.

    Verification:

    ```bash
    sha256sum -c SHA256SUMS
    tar xzf nusapeta-route_0.1.0_linux_amd64.tar.gz
    ./nusa-serve -graph <graph-file> -addr 127.0.0.1:8080
    ```

    OSM-derived data is ODbL 1.0, © OpenStreetMap contributors; see
    `LICENSE-DATA`. The code is MIT.
