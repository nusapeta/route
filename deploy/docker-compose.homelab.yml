# Override homelab: cloudflared sudah berjalan sebagai container 1Panel di
# jaringan `1panel-network`, bukan sebagai service di compose ini. Gateway
# diberi alias di jaringan itu supaya ingress `http://gateway:8080` resolve
# tanpa membuka port host ke LAN.
#
#   cd deploy
#   docker compose -f docker-compose.yml -f docker-compose.homelab.yml up -d
#
# Cek nama jaringan cloudflared lebih dulu:
#   docker inspect cloudflared-tunnel \
#     --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'
services:
  gateway:
    networks:
      default:
      tunnel:
        aliases:
          - gateway
          - nusapeta-gateway

networks:
  tunnel:
    external: true
    name: 1panel-network
