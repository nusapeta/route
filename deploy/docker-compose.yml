# Homelab deploy: Jawa + Sumatra + Bali/Nusra, satu proses, graph v4.
#   cd deploy && docker compose up -d --build
# Graph dibangun sekali di host (butuh RAM lebih besar dari saat run):
#   make java sumatra nusa-tenggara
# Format v3 (java-v3.graph.bak) hanya terbaca oleh image pre-m5; untuk rollback
# simpan image lama: docker tag routeid:local routeid:pre-m5
services:
  routeid:
    build:
      context: ..
      # Dockerfile lengkap (multi-stage, butuh tarik image golang) atau
      # deploy/Dockerfile.prebuilt (pakai bin/rid-server yang sudah dibangun).
      dockerfile: ${ROUTEID_DOCKERFILE:-Dockerfile}
      # Provenans image. Tanpa argumen ini /version melaporkan "dev".
      #   COMMIT=$(git rev-parse --short HEAD) BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
      #     docker compose build && docker compose up -d
      args:
        COMMIT: ${COMMIT:-dev}
        BUILT: ${BUILT:-unknown}
    image: routeid:local
    container_name: routeid
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ../data:/data:ro
    command:
      - -graph
      - /data/java.graph
      - -graph
      - /data/sumatra.graph
      - -graph
      - /data/nusa-tenggara.graph
      - -addr
      - :8080
      # 2 core fisik: 4 workspace -> throughput ~2,4x dibanding conc 1
      - -conc
      - "4"
      # Anggaran tabel A*: 256 MB / 4 slot = 64 MB/slot (12 B/slot). Rute <= 40 km
      # terukur 126 MB untuk 2 slot, jadi 64 MB/slot tidak mengikat kelas rute
      # yang dilayani (paper/RESULTS.md §17).
      - -workspace-mb
      - "256"
      # Kontrak aplikasi: rute > 40 km ditolak 422 (garis lurus + jarak tempuh).
      - -max-route-km
      - "40"
      # M4: batas waktu per request, rate limit per IP, cache browser/app.
      - -timeout
      - 10s
      - -rate
      - "15"
      - -burst
      - "5"
      - -maxage
      - "3600"
    environment:
      GOMEMLIMIT: 1GiB
    # terukur: 4x rute 148 km paralel = 745 MiB; sisakan kepala (paper/RESULTS.md §5)
    mem_limit: 1536m
    memswap_limit: 1536m
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
