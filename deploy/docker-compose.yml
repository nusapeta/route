# Homelab deploy: satu graph nasional Indonesia untuk profil mobil dan motor
# (format v5 menyimpan kedua kelas sekaligus).
#   cd deploy && docker compose up -d --build
# Graph dibangun sekali di host (butuh RAM lebih besar dari saat run):
#   GOMEMLIMIT=5GiB scripts/build-national.sh
#     -> data/indonesia.graph (1,6 GB; PBF 1,7 GB)
# Format v3 (java-v3.graph.bak) hanya terbaca oleh image pre-m5; untuk rollback
# simpan image lama: docker tag nusapeta-route:local nusapeta-route:pre-m5
#
# Tiga layanan inti, satu image: profil mobil dan motor tidak boleh berada di
# proses yang sama (dua proses membuka file yang sama; profil dipilih per
# proses). Kedua proses itu hanya mendengarkan di loopback (18080/18081, untuk
# debug langsung), dan `gateway` memegang port loopback 8080: profil dipilih
# lewat ?profile=motor, tanpa parameter dilayani profil mobil. Akses publik
# lewat Cloudflare Tunnel (`cloudflared`, profil compose `cloudflare`), bukan
# IP/LAN.
#
# Graph nasional memberi cakupan lokal di seluruh Indonesia; kontrak
# -max-route-km 100 tetap berlaku. Rute antarpulau panjang (mis. Jakarta-Medan
# 1.882 km) belum dilayani tanpa hierarki dua tingkat.
x-nusapeta-route: &nusapeta-route
  image: nusapeta-route:local
  restart: unless-stopped
  volumes:
    - ../data:/data:ro
  environment:
    GOMEMLIMIT: 1GiB
  # Terukur graph nasional: 4x rute 96 km paralel = 225 MiB RSS (anon 90 MiB).
  # File graph 1,6 GB dipetakan read-only; halaman bersih bisa direklaim cgroup,
  # jadi 1536m cukup dan menyisakan kepala untuk page cache.
  mem_limit: 1536m
  memswap_limit: 1536m
  stop_grace_period: 25s
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 5s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  nusapeta-route:
    <<: *nusapeta-route
    build:
      context: ..
      # Dockerfile lengkap (multi-stage, butuh tarik image golang) atau
      # deploy/Dockerfile.prebuilt (pakai bin/nusa-serve yang sudah dibangun).
      dockerfile: ${NUSAPETA_ROUTE_DOCKERFILE:-Dockerfile}
      # Provenans image. Tanpa argumen ini /version melaporkan "dev".
      #   COMMIT=$(git rev-parse --short HEAD) BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
      #     docker compose build && docker compose up -d
      args:
        COMMIT: ${COMMIT:-dev}
        BUILT: ${BUILT:-unknown}
    container_name: nusapeta-route
    ports:
      # loopback saja: yang publik adalah gateway
      - "127.0.0.1:18080:8080"
    command:
      - -graph
      - /data/indonesia.graph
      - -addr
      - :8080
      # 2 core fisik: 4 workspace -> throughput ~2,4x dibanding conc 1
      - -conc
      - "4"
      # Anggaran tabel A*: 256 MB / 4 slot = 64 MB/slot (12 B/slot). Rute <= 100 km
      # terukur 126 MB tabel untuk 4 slot (puncak), jadi anggaran ini tidak
      # mengikat: menaikkannya ke 512/2048 tidak mengubah satu pun pasangan yang
      # gagal (paper/RESULTS.md §19).
      - -workspace-mb
      - "256"
      # Kontrak aplikasi: rute > 100 km ditolak 422 (garis lurus + jarak tempuh).
      - -max-route-km
      - "100"
      # M4: batas waktu per request, rate limit per IP, cache browser/app.
      - -timeout
      - 10s
      # Batas lunak pencarian = 60% dari -timeout. Rute yang tidak selesai
      # berhenti sendiri dan dijawab 422 "search budget", bukan 504 yang
      # kemunculannya bergantung pada beban mesin (i3: 6 juta ekspansi = 12,8 s,
      # jadi batas waktu keras selalu menang sebelum plafon ekspansi tercapai).
      - -budget
      - 6s
      # Plafon ekspansi per query: deterministik, tidak bergantung kecepatan
      # mesin. Lulusan terukur maksimum 3,19 juta ekspansi (600 pasangan bench),
      # jadi 4 juta tidak memotong satu pun rute yang berhasil.
      - -max-expansions
      - "4000000"
      - -rate
      - "15"
      - -burst
      - "5"
      - -maxage
      - "3600"
      # Hanya di belakang gateway: rate limit memakai IP asli dari
      # X-Forwarded-For, dan gateway menimpanya (bukan menambahkan) supaya
      # klien tidak bisa memilih bucket sendiri.
      - -trust-proxy

  gateway:
    image: nusapeta-route:local
    container_name: nusapeta-gateway
    restart: unless-stopped
    # Binary yang sama, entrypoint berbeda: satu image untuk server dan gateway.
    entrypoint: ["/usr/local/bin/nusa-gateway"]
    ports:
      # Hanya loopback: Cloudflare Tunnel yang memegang akses publik. Jangan
      # ganti ke 0.0.0.0 kecuali memang ingin membuka IP LAN lagi.
      - "127.0.0.1:8080:8080"
    depends_on:
      - nusapeta-route
      - nusapeta-route-motor
    command:
      - -addr
      - :8080
      - -mobil
      - http://nusapeta-route:8080
      - -motor
      - http://nusapeta-route-motor:8080
      - -default
      - mobil
      # Cloudflare Tunnel mengirim CF-Connecting-IP; pakai itu supaya rate
      # limit upstream tetap per klien, bukan per container cloudflared.
      - -trust-proxy
      # Jangan pernah menerbitkan /metrics lewat domain publik. Monitoring
      # membaca http://127.0.0.1:18080/metrics dan :18081/metrics langsung.
      - -block-metrics
      # Geocoder dari project Compose lain (`placeid`) di jaringan tunnel yang
      # sama. Prefix /place adalah satu-satunya sinyal routing: hostname publik
      # hanya punya satu route tunnel, jadi hostname kedua tidak bisa sampai ke
      # proses ini. Kalau container placeid mati, /place menjawab 502 dan
      # /healthz tetap 200, sehingga gateway tidak ikut dianggap gagal.
      - -place
      - http://placeid:8090
      # Pencarian placeid memindai seluruh index: plafon terukurnya ~20 RPS,
      # jadi satu klien tidak boleh menghabiskan jatah klien lain.
      - -place-rate
      - "240"
      - -place-burst
      - "40"
    # Cuma proxy: tanpa graf, tanpa tabel A*.
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Akses publik hanya lewat domain. Service ini memakai jaringan compose
  # internal, jadi route Cloudflare diarahkan ke http://gateway:8080, bukan
  # port host. Aktifkan dengan --profile cloudflare dan isi
  # CLOUDFLARE_TUNNEL_TOKEN di deploy/.env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nusapeta-route-cloudflared
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 128m
    memswap_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nusapeta-route-motor:
    <<: *nusapeta-route
    container_name: nusapeta-route-motor
    ports:
      # port host beda; di dalam container tetap 8080
      - "127.0.0.1:18081:8080"
    command:
      - -profile
      - motor
      - -graph
      - /data/indonesia.graph
      - -addr
      - :8080
      # Sisa flag sengaja ditulis ulang, bukan dibiarkan default: nilai default
      # di kode bisa berubah tanpa disadari. Samakan dengan layanan nusapeta-route.
      - -conc
      - "4"
      - -workspace-mb
      - "256"
      - -max-route-km
      - "100"
      - -timeout
      - 10s
      # Batas lunak pencarian = 60% dari -timeout. Rute yang tidak selesai
      # berhenti sendiri dan dijawab 422 "search budget", bukan 504 yang
      # kemunculannya bergantung pada beban mesin (i3: 6 juta ekspansi = 12,8 s,
      # jadi batas waktu keras selalu menang sebelum plafon ekspansi tercapai).
      - -budget
      - 6s
      # Plafon ekspansi per query: deterministik, tidak bergantung kecepatan
      # mesin. Lulusan terukur maksimum 3,19 juta ekspansi (600 pasangan bench),
      # jadi 4 juta tidak memotong satu pun rute yang berhasil.
      - -max-expansions
      - "4000000"
      - -rate
      - "15"
      - -burst
      - "5"
      - -maxage
      - "3600"
      # Hanya di belakang gateway: rate limit memakai IP asli dari
      # X-Forwarded-For, dan gateway menimpanya (bukan menambahkan) supaya
      # klien tidak bisa memilih bucket sendiri.
      - -trust-proxy
