# Homelab deploy: Jawa + Sumatra + Bali/Nusra (mobil), plus ketiga region itu
# untuk motor.
#   cd deploy && docker compose up -d --build
# Graph dibangun sekali di host (butuh RAM lebih besar dari saat run):
#   make java sumatra nusa-tenggara        (mobil)
#   make graph REGION=java PROFILE=motor   (motor, ulangi sumatra/nusa-tenggara)
#     -> data/java-motor.graph, data/sumatra-motor.graph, data/nusa-tenggara-motor.graph
# Format v3 (java-v3.graph.bak) hanya terbaca oleh image pre-m5; untuk rollback
# simpan image lama: docker tag routeid:local routeid:pre-m5
#
# Tiga layanan, satu image: pemilihan region memakai snap terdekat, jadi profil
# mobil dan motor tidak boleh berada di proses yang sama (dua graph dengan
# geometri hampir identik akan saling menutupi). Kedua proses itu karena itu
# hanya mendengarkan di loopback (18080/18081, untuk debug langsung), dan
# `gateway` memegang port publik 8080: profil dipilih lewat ?profile=motor,
# tanpa parameter dilayani profil mobil.
x-routeid: &routeid
  image: routeid:local
  restart: unless-stopped
  volumes:
    - ../data:/data:ro
  environment:
    GOMEMLIMIT: 1GiB
  # terukur: 4x rute 148 km paralel = 745 MiB; sisakan kepala (paper/RESULTS.md §5)
  mem_limit: 1536m
  memswap_limit: 1536m
  stop_grace_period: 25s
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 5s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  routeid:
    <<: *routeid
    build:
      context: ..
      # Dockerfile lengkap (multi-stage, butuh tarik image golang) atau
      # deploy/Dockerfile.prebuilt (pakai bin/rid-server yang sudah dibangun).
      dockerfile: ${ROUTEID_DOCKERFILE:-Dockerfile}
      # Provenans image. Tanpa argumen ini /version melaporkan "dev".
      #   COMMIT=$(git rev-parse --short HEAD) BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
      #     docker compose build && docker compose up -d
      args:
        COMMIT: ${COMMIT:-dev}
        BUILT: ${BUILT:-unknown}
    container_name: routeid
    ports:
      # loopback saja: yang publik adalah gateway
      - "127.0.0.1:18080:8080"
    command:
      - -graph
      - /data/java.graph
      - -graph
      - /data/sumatra.graph
      - -graph
      - /data/nusa-tenggara.graph
      - -addr
      - :8080
      # 2 core fisik: 4 workspace -> throughput ~2,4x dibanding conc 1
      - -conc
      - "4"
      # Anggaran tabel A*: 256 MB / 4 slot = 64 MB/slot (12 B/slot). Rute <= 40 km
      # terukur 126 MB untuk 2 slot, jadi 64 MB/slot tidak mengikat kelas rute
      # yang dilayani (paper/RESULTS.md §17).
      - -workspace-mb
      - "256"
      # Kontrak aplikasi: rute > 40 km ditolak 422 (garis lurus + jarak tempuh).
      - -max-route-km
      - "40"
      # M4: batas waktu per request, rate limit per IP, cache browser/app.
      - -timeout
      - 10s
      - -rate
      - "15"
      - -burst
      - "5"
      - -maxage
      - "3600"
      # Hanya di belakang gateway: rate limit memakai IP asli dari
      # X-Forwarded-For, dan gateway menimpanya (bukan menambahkan) supaya
      # klien tidak bisa memilih bucket sendiri.
      - -trust-proxy
      - -trust-proxy

  gateway:
    image: routeid:local
    container_name: routeid-gateway
    restart: unless-stopped
    # Binary yang sama, entrypoint berbeda: satu image untuk server dan gateway.
    entrypoint: ["/usr/local/bin/rid-gateway"]
    ports:
      - "8080:8080"
    depends_on:
      - routeid
      - routeid-motor
    command:
      - -addr
      - :8080
      - -mobil
      - http://routeid:8080
      - -motor
      - http://routeid-motor:8080
      - -default
      - mobil
    # Cuma proxy: tanpa graf, tanpa tabel A*.
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  routeid-motor:
    <<: *routeid
    container_name: routeid-motor
    ports:
      # port host beda; di dalam container tetap 8080
      - "127.0.0.1:18081:8080"
    command:
      - -graph
      - /data/java-motor.graph
      - -graph
      - /data/sumatra-motor.graph
      - -graph
      - /data/nusa-tenggara-motor.graph
      - -addr
      - :8080
      # Sisa flag sengaja ditulis ulang, bukan dibiarkan default: nilai default
      # di kode bisa berubah tanpa disadari. Samakan dengan layanan routeid.
      - -conc
      - "4"
      - -workspace-mb
      - "256"
      - -max-route-km
      - "40"
      - -timeout
      - 10s
      - -rate
      - "15"
      - -burst
      - "5"
      - -maxage
      - "3600"
      # Hanya di belakang gateway: rate limit memakai IP asli dari
      # X-Forwarded-For, dan gateway menimpanya (bukan menambahkan) supaya
      # klien tidak bisa memilih bucket sendiri.
      - -trust-proxy
