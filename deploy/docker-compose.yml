# Homelab deploy: Jawa + Sumatra + Bali/Nusra, satu artefak per region untuk
# profil mobil dan motor (format v5 menyimpan kedua kelas sekaligus).
#   cd deploy && docker compose up -d --build
# Graph dibangun sekali di host (butuh RAM lebih besar dari saat run):
#   make java sumatra nusa-tenggara
#     -> data/java.graph, data/sumatra.graph, data/nusa-tenggara.graph
# Format v3 (java-v3.graph.bak) hanya terbaca oleh image pre-m5; untuk rollback
# simpan image lama: docker tag routeid:local routeid:pre-m5
#
# Tiga layanan inti, satu image: pemilihan region memakai snap terdekat, jadi
# profil mobil dan motor tidak boleh berada di proses yang sama (dua proses
# membuka file yang sama; profil dipilih per proses). Kedua proses itu hanya
# mendengarkan di loopback (18080/18081, untuk debug langsung), dan `gateway`
# memegang port loopback 8080: profil dipilih lewat ?profile=motor, tanpa
# parameter dilayani profil mobil. Akses publik lewat Cloudflare Tunnel
# (`cloudflared`, profil compose `cloudflare`), bukan IP/LAN.
x-routeid: &routeid
  image: routeid:local
  restart: unless-stopped
  volumes:
    - ../data:/data:ro
  environment:
    GOMEMLIMIT: 1GiB
  # terukur: 4x rute 148 km paralel = 745 MiB; sisakan kepala (paper/RESULTS.md §5)
  mem_limit: 1536m
  memswap_limit: 1536m
  stop_grace_period: 25s
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 5s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  routeid:
    <<: *routeid
    build:
      context: ..
      # Dockerfile lengkap (multi-stage, butuh tarik image golang) atau
      # deploy/Dockerfile.prebuilt (pakai bin/rid-server yang sudah dibangun).
      dockerfile: ${ROUTEID_DOCKERFILE:-Dockerfile}
      # Provenans image. Tanpa argumen ini /version melaporkan "dev".
      #   COMMIT=$(git rev-parse --short HEAD) BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
      #     docker compose build && docker compose up -d
      args:
        COMMIT: ${COMMIT:-dev}
        BUILT: ${BUILT:-unknown}
    container_name: routeid
    ports:
      # loopback saja: yang publik adalah gateway
      - "127.0.0.1:18080:8080"
    command:
      - -graph
      - /data/java.graph
      - -graph
      - /data/sumatra.graph
      - -graph
      - /data/nusa-tenggara.graph
      - -addr
      - :8080
      # 2 core fisik: 4 workspace -> throughput ~2,4x dibanding conc 1
      - -conc
      - "4"
      # Anggaran tabel A*: 256 MB / 4 slot = 64 MB/slot (12 B/slot). Rute <= 100 km
      # terukur 126 MB tabel untuk 4 slot (puncak), jadi anggaran ini tidak
      # mengikat: menaikkannya ke 512/2048 tidak mengubah satu pun pasangan yang
      # gagal (paper/RESULTS.md §19).
      - -workspace-mb
      - "256"
      # Kontrak aplikasi: rute > 100 km ditolak 422 (garis lurus + jarak tempuh).
      - -max-route-km
      - "100"
      # M4: batas waktu per request, rate limit per IP, cache browser/app.
      - -timeout
      - 10s
      # Batas lunak pencarian = 60% dari -timeout. Rute yang tidak selesai
      # berhenti sendiri dan dijawab 422 "search budget", bukan 504 yang
      # kemunculannya bergantung pada beban mesin (i3: 6 juta ekspansi = 12,8 s,
      # jadi batas waktu keras selalu menang sebelum plafon ekspansi tercapai).
      - -budget
      - 6s
      # Plafon ekspansi per query: deterministik, tidak bergantung kecepatan
      # mesin. Lulusan terukur maksimum 3,19 juta ekspansi (600 pasangan bench),
      # jadi 4 juta tidak memotong satu pun rute yang berhasil.
      - -max-expansions
      - "4000000"
      - -rate
      - "15"
      - -burst
      - "5"
      - -maxage
      - "3600"
      # Hanya di belakang gateway: rate limit memakai IP asli dari
      # X-Forwarded-For, dan gateway menimpanya (bukan menambahkan) supaya
      # klien tidak bisa memilih bucket sendiri.
      - -trust-proxy

  gateway:
    image: routeid:local
    container_name: routeid-gateway
    restart: unless-stopped
    # Binary yang sama, entrypoint berbeda: satu image untuk server dan gateway.
    entrypoint: ["/usr/local/bin/rid-gateway"]
    ports:
      # Hanya loopback: Cloudflare Tunnel yang memegang akses publik. Jangan
      # ganti ke 0.0.0.0 kecuali memang ingin membuka IP LAN lagi.
      - "127.0.0.1:8080:8080"
    depends_on:
      - routeid
      - routeid-motor
    command:
      - -addr
      - :8080
      - -mobil
      - http://routeid:8080
      - -motor
      - http://routeid-motor:8080
      - -default
      - mobil
      # Cloudflare Tunnel mengirim CF-Connecting-IP; pakai itu supaya rate
      # limit upstream tetap per klien, bukan per container cloudflared.
      - -trust-proxy
      # Jangan pernah menerbitkan /metrics lewat domain publik. Monitoring
      # membaca http://127.0.0.1:18080/metrics dan :18081/metrics langsung.
      - -block-metrics
    # Cuma proxy: tanpa graf, tanpa tabel A*.
    mem_limit: 64m
    memswap_limit: 64m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Akses publik hanya lewat domain. Service ini memakai jaringan compose
  # internal, jadi route Cloudflare diarahkan ke http://gateway:8080, bukan
  # port host. Aktifkan dengan --profile cloudflare dan isi
  # CLOUDFLARE_TUNNEL_TOKEN di deploy/.env.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: routeid-cloudflared
    restart: unless-stopped
    profiles: ["cloudflare"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      gateway:
        condition: service_healthy
    mem_limit: 128m
    memswap_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  routeid-motor:
    <<: *routeid
    container_name: routeid-motor
    ports:
      # port host beda; di dalam container tetap 8080
      - "127.0.0.1:18081:8080"
    command:
      - -profile
      - motor
      - -graph
      - /data/java.graph
      - -graph
      - /data/sumatra.graph
      - -graph
      - /data/nusa-tenggara.graph
      - -addr
      - :8080
      # Sisa flag sengaja ditulis ulang, bukan dibiarkan default: nilai default
      # di kode bisa berubah tanpa disadari. Samakan dengan layanan routeid.
      - -conc
      - "4"
      - -workspace-mb
      - "256"
      - -max-route-km
      - "100"
      - -timeout
      - 10s
      # Batas lunak pencarian = 60% dari -timeout. Rute yang tidak selesai
      # berhenti sendiri dan dijawab 422 "search budget", bukan 504 yang
      # kemunculannya bergantung pada beban mesin (i3: 6 juta ekspansi = 12,8 s,
      # jadi batas waktu keras selalu menang sebelum plafon ekspansi tercapai).
      - -budget
      - 6s
      # Plafon ekspansi per query: deterministik, tidak bergantung kecepatan
      # mesin. Lulusan terukur maksimum 3,19 juta ekspansi (600 pasangan bench),
      # jadi 4 juta tidak memotong satu pun rute yang berhasil.
      - -max-expansions
      - "4000000"
      - -rate
      - "15"
      - -burst
      - "5"
      - -maxage
      - "3600"
      # Hanya di belakang gateway: rate limit memakai IP asli dari
      # X-Forwarded-For, dan gateway menimpanya (bukan menambahkan) supaya
      # klien tidak bisa memilih bucket sendiri.
      - -trust-proxy
