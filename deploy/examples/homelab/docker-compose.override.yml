# Contoh override: cloudflared berjalan sebagai container terpisah di network
# eksternal, bukan sebagai service di compose ini. Service `api` (gateway HTTP)
# diberi alias di network itu supaya container lain, misalnya halaman demo di
# repo nusapeta/demo, bisa memanggil `http://nusapeta-gateway:8080` tanpa
# membuka port host ke LAN.
#
#   export TUNNEL_NETWORK=1panel-network   # ganti sesuai network cloudflared
#   cd deploy
#   docker compose -f docker-compose.yml -f examples/homelab/docker-compose.override.yml up -d
#
# Cek nama network cloudflared lebih dulu:
#   docker inspect cloudflared-tunnel \
#     --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{"\n"}}{{end}}'
services:
  api:
    networks:
      default:
      tunnel:
        aliases:
          - nusapeta-gateway

networks:
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-1panel-network}
